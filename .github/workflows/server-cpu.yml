# Track N7 (docs/reassessment/ROADMAP.md): the real llama-server of R1 (llama.cpp at the tools/engines/pins.json commit),
# CPU build, on tiny hybrid-memory models (qwen4exp, glm5-next, each also with an MTP block): determinism, prefix
# reuse, context-checkpoint fallback, --cache-reuse, slot save/restore incl. a restart, two-slot isolation, MTP vs
# plain greedy decode. No GPU: nothing here says anything about speed or GPU kernels.
name: server-cpu
on:
  workflow_dispatch:
  push:
    paths: [tools/srvcheck/**, tools/kv/**, tools/tinygen/**, tools/engines/pins.json, tests/test_srvcheck.py, tests/test_n7_report.py,
            tests/fixtures/srvcheck/**, .github/workflows/server-cpu.yml]
  pull_request:
    paths: [tools/srvcheck/**, tools/kv/**, tools/tinygen/**, tools/engines/pins.json, tests/test_srvcheck.py, tests/test_n7_report.py,
            tests/fixtures/srvcheck/**, .github/workflows/server-cpu.yml]
concurrency:
  group: server-cpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  n7:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: pip install numpy
      - name: harness tests against a stand-in server (fault injection)
        run: python3 -m unittest tests.test_srvcheck tests.test_n7_report -v
      - name: llama.cpp at the pinned commit (tools/engines/pins.json)
        run: |
          SHA=$(python3 -c "import json; print(json.load(open('tools/engines/pins.json'))['engines']['llama.cpp']['sha'])")
          git init -q ../llama.cpp
          git -C ../llama.cpp fetch -q --depth 1 https://github.com/ggml-org/llama.cpp "$SHA"
          git -C ../llama.cpp checkout -q FETCH_HEAD
      - name: N7 llama-server checks on tiny qwen4exp and glm5-next (CPU)
        run: tools/srvcheck/run_n7.sh ../llama.cpp ../build-n7 "${{ runner.temp }}/n7-out"
      - name: keep results and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n7-server-cpu
          path: |
            ${{ runner.temp }}/n7-out/*.json
            ${{ runner.temp }}/n7-out/*/*.log
