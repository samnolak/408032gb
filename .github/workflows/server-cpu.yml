# Track N7 (docs/reassessment/ROADMAP.md): the real llama-server of R1 (llama.cpp at the tools/engines/pins.json commit),
# CPU build, on tiny hybrid-memory models (qwen4exp, glm5-next, each also with an MTP block): determinism, prefix
# reuse, context-checkpoint fallback, --cache-reuse, slot save/restore incl. a restart, two-slot isolation, MTP vs
# plain greedy decode; N8: corrupted slot files restored raw vs through tools/kv/session_store.py. Track N11: the
# measurement tools of R1 (tools/bench, tools/quality/logprob_compare.py, tools/gateway, tools/kv/slot_persist.py,
# scripts/r1/run_r1.py + tools/verify/pack.py) against the same server build on a tiny qwen4exp with a text vocabulary:
# formats and protocols only (tools/srvcheck/r1_tools_smoke.py).
# No GPU: nothing here says anything about speed or GPU kernels.
name: server-cpu
on:
  workflow_dispatch:
  push:
    paths: [tools/srvcheck/**, tools/kv/**, tools/tinygen/**, tools/engines/pins.json, tests/test_srvcheck.py, tests/test_n7_report.py,
            tests/test_session_store.py, tests/fixtures/srvcheck/**, .github/workflows/server-cpu.yml, tools/bench/**,
            tools/quality/**, tools/gateway/**, tools/verify/**, scripts/r1/**, tests/test_r1_tools_smoke.py,
            tests/test_tinygen_text_vocab.py, tools/gguf_quant_audit.py, tools/roofline.py, models/specs/**,
            hardware/target-4x4080-32g.unverified.json]
  pull_request:
    paths: [tools/srvcheck/**, tools/kv/**, tools/tinygen/**, tools/engines/pins.json, tests/test_srvcheck.py, tests/test_n7_report.py,
            tests/test_session_store.py, tests/fixtures/srvcheck/**, .github/workflows/server-cpu.yml, tools/bench/**,
            tools/quality/**, tools/gateway/**, tools/verify/**, scripts/r1/**, tests/test_r1_tools_smoke.py,
            tests/test_tinygen_text_vocab.py, tools/gguf_quant_audit.py, tools/roofline.py, models/specs/**,
            hardware/target-4x4080-32g.unverified.json]
concurrency:
  group: server-cpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  n7:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: pip install numpy
      - name: harness tests against a stand-in server (fault injection)
        run: python3 -m unittest tests.test_srvcheck tests.test_n7_report tests.test_session_store -v
      - name: N11 derived R1 config (no server)
        run: python3 -m unittest tests.test_r1_tools_smoke -v
      - name: llama.cpp at the pinned commit (tools/engines/pins.json)
        run: |
          SHA=$(python3 -c "import json; print(json.load(open('tools/engines/pins.json'))['engines']['llama.cpp']['sha'])")
          git init -q ../llama.cpp
          git -C ../llama.cpp fetch -q --depth 1 https://github.com/ggml-org/llama.cpp "$SHA"
          git -C ../llama.cpp checkout -q FETCH_HEAD
      - name: tiny-model generators (text vocabulary; defaults byte-identical)
        run: LLAMA_CPP_GGUF_PY=../llama.cpp/gguf-py python3 -m unittest tests.test_tinygen_text_vocab -v
      - name: N7 llama-server checks on tiny qwen4exp and glm5-next (CPU)
        run: tools/srvcheck/run_n7.sh ../llama.cpp ../build-n7 "${{ runner.temp }}/n7-out"
      - name: N8 corrupted slot files - raw llama-server vs tools/kv/session_store.py (CPU)
        run: |
          for m in qwen4exp glm5next; do
            python3 tools/kv/slot_corruption_probe.py --server ../build-n7/bin/llama-server \
              --model "${{ runner.temp }}/n7-out/$m.gguf" --workdir "${{ runner.temp }}/n8-out/$m" \
              --out "${{ runner.temp }}/n8-out/$m.json"
          done
      - name: N11 R1 measurement tools against the real llama-server (CPU, tiny text-vocab model)
        run: tools/srvcheck/run_n11.sh ../llama.cpp ../build-n7 "${{ runner.temp }}/n11-out"
      - name: keep results and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n7-server-cpu
          path: |
            ${{ runner.temp }}/n7-out/*.json
            ${{ runner.temp }}/n7-out/*/*.log
            ${{ runner.temp }}/n8-out/*.json
            ${{ runner.temp }}/n11-out/*.json
            ${{ runner.temp }}/n11-out/work/*.log
            ${{ runner.temp }}/n11-out/work/r1runs/*/run.json
            ${{ runner.temp }}/n11-out/work/r1runs/*/pack/VERDICT.md
