# Copy to .github/workflows/ci.yml (pushing workflow files needs the token's Workflows permission).
# Runs on GitHub's free runners: no GPU, no customer PC needed.
name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  cpu-parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: llama.cpp at the pinned commit
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git ../llama.cpp
          git -C ../llama.cpp checkout ec7630a640789c393694fb194f1bbbf0369fc62d
          touch ../llama.cpp/ggml/ggml.pc.in   # needed only for the standalone ggml build below
      - name: deps
        # jinja2: tests/test_chat_templates.py (N14) renders the vendored chat templates; without it its
        # TemplateProperties class would skip in the unwrapped `unit tests` step
        run: pip install numpy pyyaml jinja2
      # Every parity step below goes through tools/ci/check_unittest.py: green only if its unittest run is OK with exactly
      # the tests and skips tools/ci/parity_expectations.json lists for the checkout's commit (a missing dump or env
      # variable makes the tests skip, which unittest alone reports as OK; docs/reassessment/CORRECTNESS.md gap 11 (a)).
      # The `unit tests` step right below is not wrapped: discover skips every dump test by design
      # (docs/evidence/2026-10-11-n13-ci-no-silent-skips.md section 6); the other unwrapped steps of the parity jobs are
      # listed with their reasons in ALLOWED_UNWRAPPED of tests/test_check_unittest.py.
      # No nvcc in this job: tests.test_diag_kit.CudaCompile (scripts/diag/*.cu for sm_89) skips here and is reported as
      # a warning annotation; the build itself runs in the cuda-compile job below, which fails on that skip
      # (docs/reassessment/CORRECTNESS.md gap 11 (c)). shell: bash = -eo pipefail, so the tee keeps unittest's status.
      - name: unit tests
        shell: bash
        run: |
          python3 -m unittest discover -s tests -v 2>&1 | tee unit.log
          echo "::notice::unit tests: $(grep -E '^Ran |^OK|^FAILED' unit.log | tr '\n' ' ')"
          if grep -q "skipped 'nvcc not available" unit.log; then
            echo "::warning::scripts/diag/*.cu NOT compiled in this job (no nvcc here): tests.test_diag_kit.CudaCompile skipped; the sm_89 build runs in job cuda-compile"
          fi
      - name: ggml delta-net parity (CPU)
        run: |
          cmake -S ../llama.cpp/ggml -B ../ggml-build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF -DGGML_OPENMP=OFF -DGGML_BACKEND_DL=OFF -DGGML_BUILD_TESTS=OFF -DGGML_BUILD_EXAMPLES=OFF
          cmake --build ../ggml-build -j4 --target ggml
          tests/ggml_parity/build.sh ../llama.cpp ../ggml-build
          GGML_GDN_HARNESS=tests/ggml_parity/gdn_harness LLAMA_CPP_GGUF_PY=../llama.cpp/gguf-py \
            python3 tools/ci/check_unittest.py --step ggml-gdn --checkout ../llama.cpp -- \
            python3 -m unittest tests.test_kda_vs_ggml tests.test_fitplan -v
      - name: G1 tiny-model parity against the real glm5-next graph (CPU)
        run: python3 tools/ci/check_unittest.py --step g1-glm --checkout ../llama.cpp -- tools/tinygen/run_parity.sh ../llama.cpp ../build-tools
      - name: MiMo G1 tiny-model parity against the real mimo2 graph (CPU)
        run: python3 tools/ci/check_unittest.py --step g1-mimo --checkout ../llama.cpp -- tools/tinygen/run_parity_mimo.sh ../llama.cpp ../build-tools
      - name: N2 qwen4exp (candidate 1) tiny-model parity against the real qwen4exp graph (CPU)
        run: python3 tools/ci/check_unittest.py --step n2-qwen4exp --checkout ../llama.cpp -- tools/tinygen/run_parity_qwen4exp.sh ../llama.cpp ../build-tools
      - name: N6 qwen4exp several ubatches, token-by-token decode, rollback and MTP against the real qwen4exp graph (CPU)
        run: python3 tools/ci/check_unittest.py --step n6-qwen4exp-decode --checkout ../llama.cpp -- tools/tinygen/run_parity_qwen4exp_decode.sh ../llama.cpp ../build-tools
      - name: N9 glm5-next several ubatches, token-by-token decode and rollback against the real glm5-next graph (CPU; this pin has no glm5-next MTP graph)
        run: python3 tools/ci/check_unittest.py --step n9-glm5next-decode --checkout ../llama.cpp -- tools/tinygen/run_parity_glm5next_decode.sh ../llama.cpp ../build-tools
      - name: N10 R1 default precision (-ctk f16 -ctv f16 -fa on) - qwen4exp and glm5-next runs against the precision-aware oracles (CPU)
        run: python3 tools/ci/check_unittest.py --step n10-f16fa --checkout ../llama.cpp -- tools/tinygen/run_parity_f16fa.sh ../llama.cpp ../build-tools
      - name: N10 quantized weights (Q8_0, Q4_K_M by the pinned llama-quantize) - every qwen4exp and glm5-next matrix product against ref/quant.py (CPU)
        run: python3 tools/ci/check_unittest.py --step n10-quant --checkout ../llama.cpp -- tools/tinygen/run_parity_quant.sh ../llama.cpp ../build-tools
      - name: N16 mimo2 (MiMo) ubatches, decode past the SWA cache, rollbacks, MTP and MXFP4 experts against the real mimo2 graph (CPU)
        run: python3 tools/ci/check_unittest.py --step n16-mimo2-decode --checkout ../llama.cpp -- tools/tinygen/run_parity_mimo2_decode.sh ../llama.cpp ../build-tools
      - name: N17 mimo2 three MTP heads (nextn_layer_offset 0-2, drafts, rejections) and the R1 default precision (-ctk f16 -ctv f16 -fa on, sinks, K/V heads 24/16 and 192/128) against the real mimo2 graph (CPU)
        run: python3 tools/ci/check_unittest.py --step n17-mimo2-mtp-heads-fa --checkout ../llama.cpp -- tools/tinygen/run_parity_mimo2_n17.sh ../llama.cpp ../build-tools
      - name: N19 qwen4exp several sequences in one context, seq_cp, seq_rm and rollback edges against the real qwen4exp graph (CPU)
        run: python3 tools/ci/check_unittest.py --step n19-qwen4exp-multiseq --checkout ../llama.cpp -- tools/tinygen/run_parity_qwen4exp_multiseq.sh ../llama.cpp ../build-tools
      - name: N20 recurrent rollback guard (patches/llama.cpp, applied to a copy) - the N19 plans and four guard plans on the patched qwen4exp graph (CPU)
        run: python3 tools/ci/check_unittest.py --step n20-qwen4exp-rs-guard --checkout ../llama.cpp -- tools/tinygen/run_parity_qwen4exp_rs_guard.sh ../llama.cpp ../build-tools-rs-guard
      - name: N21 mimo2 MTP heads - upstream placement (ring wrap, several ubatches) and llama.cpp's own common/speculative.cpp against the replay (CPU; the runs of the patch skip at this unpatched pin)
        run: python3 tools/ci/check_unittest.py --step n21-mimo2-mtp-fix --checkout ../llama.cpp -- tools/tinygen/run_parity_mimo2_n21.sh ../llama.cpp ../build-tools
      - name: G0 per-token routing tracer + cache simulator on the tiny glm5-next model (CPU smoke)
        run: tools/g0/run_trace_smoke.sh ../llama.cpp ../build-tools
      - name: G0 trace + probe on a tiny qwen3moe (last layer keeps only output rows; predict_eval self-checks) (CPU smoke)
        run: |
          cmake --build ../build-tools -j"$(nproc)" --target g0-expert-trace g0-expert-probe > /dev/null
          scripts/traces/smoke_tiny.sh ../llama.cpp ../build-tools ../smoke-tiny
      - name: roofline, cache-simulator and GGUF-audit unit tests (type table checked against the pinned gguf-py)
        run: |
          LLAMA_CPP_GGUF_PY=../llama.cpp/gguf-py python3 tools/ci/check_unittest.py --step gguf-audit --checkout ../llama.cpp -- \
            python3 -m unittest tests.test_roofline tests.test_cachesim tests.test_gguf_quant_audit tests.test_offline_weights -v
  ref-torch-cpu:
    # Oracles whose reference is torch code (vendored, pinned): DFlash2 primitives against vLLM (ADR-011).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: deps (CPU torch)
        run: pip install -q numpy && pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: DFlash2 oracle against the vendored vLLM functions
        shell: bash
        run: |
          set +e
          python3 -m unittest tests.test_dflash2_ref -v > t.log 2>&1; rc=$?
          echo "::notice::dflash2 oracle vs vLLM: $(grep -E '^Ran |^OK|^FAILED' t.log | tr '\n' ' ') torch $(python3 -c 'import torch; print(torch.__version__)')"
          if [ $rc -ne 0 ]; then grep -nE 'FAIL|ERROR|Error' t.log | head -8 | while IFS= read -r l; do echo "::error::${l:0:600}"; done; fi
          grep -q 'skipped' t.log && { echo "::error::reference tests were skipped: torch did not import"; rc=1; }
          exit $rc
  cuda-compile:
    # The repo's own CUDA sources built for sm_89 (docs/reassessment/CORRECTNESS.md gap 11 (b), (c)). There is no
    # kernels/ directory; today these are the R0 diagnostics scripts/diag/*.cu. tests.test_diag_kit.CudaSourcesInCi
    # fails if a tracked .cu outside third_party/ is not among them. The engine forks are built elsewhere
    # (strata-glm-sm89, lt-strata-sm89 below, engines-sm89.yml), not here. No GPU: nothing is executed.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: CUDA toolkit (compile only, no GPU on the runner)
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb && sudo apt-get update -q
          sudo apt-get install -y -q cuda-nvcc-13-0 cuda-cudart-dev-13-0 cuda-cuobjdump-13-0
      - name: scripts/diag/*.cu built for sm_89, binaries hold sm_89 code (tests/test_diag_kit.py CudaCompile; a skip or an empty run fails)
        shell: bash
        run: |
          set +e
          NVCC=/usr/local/cuda-13.0/bin/nvcc python3 -m unittest tests.test_diag_kit.CudaCompile tests.test_diag_kit.CudaSourcesInCi -v > t.log 2>&1; rc=$?
          cat t.log
          echo "::notice::sm_89 CUDA build: $(grep -E '^Ran |^OK|^FAILED|nvcc -arch=sm_89 OK' t.log | tr '\n' ' ') $(/usr/local/cuda-13.0/bin/nvcc --version | tail -n 2 | tr '\n' ' ')"
          if [ $rc -ne 0 ]; then grep -nE 'FAIL|ERROR|Error|error' t.log | head -8 | while IFS= read -r l; do echo "::error::${l:0:600}"; done; fi
          # a skip: the summary's skipped=K or a `... skipped '<reason>'` line (a bare 'skipped' matches test names)
          grep -qE "skipped=|\.\.\. skipped '" t.log && { echo "::error::the sm_89 CUDA build was skipped (nvcc, cuobjdump or git not found)"; rc=1; }
          grep -qE '^Ran [1-9][0-9]* tests? ' t.log || { echo "::error::no test ran"; rc=1; }
          exit $rc
  strata-glm-sm89:
    # ADR-007: the GLM engine base (sergqwer/strata-glm, MIT) built for the server's GPUs on Linux.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [89, 86]      # 89 = RTX 4080 Super (the server), 86 = RTX 3090 (the test host, branch 3090)
    steps:
      - name: CUDA 13 toolkit + cuBLAS (no GPU on the runner)
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb && sudo apt-get update -q
          sudo apt-get install -y -q cuda-nvcc-13-0 cuda-cudart-dev-13-0 libcublas-dev-13-0 cuda-cuobjdump-13-0 cuda-profiler-api-13-0 ninja-build
      - uses: actions/checkout@v4
        with:
          path: ours
      - name: strata-glm at the pinned commit + our patches (patches/strata-glm, ADR-007)
        shell: bash
        run: |
          git clone https://github.com/sergqwer/strata-glm.git
          git -C strata-glm checkout ed37419fccd0c52e07d26d526a29c2098f547843
          for p in ours/patches/strata-glm/*.patch; do
            git -C strata-glm apply --verbose "$PWD/$p" || { echo "::error::patch does not apply: $p"; exit 1; }
            echo "::notice::applied $(basename "$p")"
          done
      - name: Linux disk tier (patch 0003) functional test, CPU
        shell: bash
        run: ours/tests/strata_glm/run_diskreader_test.sh strata-glm
      - name: configure (sm_89 = RTX 4080 Super)
        shell: bash
        run: |
          set -o pipefail
          if ! cmake -G Ninja -S strata-glm -B build -DCMAKE_BUILD_TYPE=Release -DSTRATA_ENABLE_CUDA=ON \
               -DSTRATA_BUILD_TESTS=OFF -DCMAKE_CUDA_ARCHITECTURES=${{ matrix.arch }} \
               -DCMAKE_CUDA_COMPILER=/usr/local/cuda-13.0/bin/nvcc > cfg.log 2>&1; then
            grep -n "CMake Error" -A3 cfg.log | head -40 > err.txt || true
            while IFS= read -r l; do echo "::error::$l"; done < err.txt
            exit 1
          fi
      - name: build strata-glm
        shell: bash
        # the exit code must not be lost in a pipe; the first compiler errors are reported as annotations
        run: |
          if ! cmake --build build -j4 --target strata-glm > build.log 2>&1; then
            grep -nE "error|Error|FAILED" build.log | head -25 > err.txt || true
            while IFS= read -r l; do echo "::error::${l:0:900}"; done < err.txt
            exit 1
          fi
          echo "::notice::strata-glm build OK, $(grep -c 'Building CUDA' build.log) CUDA objects"
      - name: binary contains sm_89 code
        shell: bash
        # no early-exit pipes (head/grep -q) under pipefail; results go to annotations, readable via the API
        run: |
          bin=$(find build -type f -name strata-glm -perm -u+x -print -quit)
          if [ -z "$bin" ]; then
            echo "::error::strata-glm binary not found"
            find build -maxdepth 4 -type f -perm -u+x > exes.txt; echo "::notice::executables: $(tr '\n' ' ' < exes.txt)"
            exit 1
          fi
          echo "::notice::binary $bin, $(stat -c %s "$bin") bytes"
          /usr/local/cuda-13.0/bin/cuobjdump --list-elf "$bin" > elf.txt 2>&1 || true
          sed -E 's/.*\.(sm_[0-9a-z]+)\..*/\1/' elf.txt | sort | uniq -c > arch.txt
          echo "::notice::cubin archs: $(tr '\n' ' ' < arch.txt)"
          grep "sm_${{ matrix.arch }}" elf.txt > /dev/null
      - name: new flags are validated before any CUDA call (no GPU needed)
        shell: bash
        run: |
          bin=build/strata-glm; echo "1 2 3" > t.txt; fail=0
          expect() {   # expect <exit code> <text in stderr> <args...>
            local want=$1 text=$2; shift 2
            set +e; "$bin" "$@" > out.txt 2> err.txt; got=$?; set -e
            if [ "$got" = "$want" ] && grep -q -- "$text" err.txt; then echo "::notice::ok: $* -> $got"
            else echo "::error::$* -> exit $got, stderr: $(head -c 300 err.txt)"; fail=1; fi
          }
          expect 2 "unknown argument" --pack p --tokens t.txt --bogus
          expect 2 "increasing layers" --pack p --tokens t.txt --layer-split 50
          expect 2 "increasing layers" --pack p --tokens t.txt --layer-split 25,14
          expect 2 "needs 4 devices" --pack p --tokens t.txt --layer-split 14,25,35 --gpus 0,1
          exit $fail

  lt-strata-sm89:
    # ADR-009: GLM engine base B (lighttransport/Strata, branch glm53f, MIT): native GGUF backend, built for the
    # server's GPUs on Linux, plus its CPU-only tests. No GPU on the runner: nothing here measures speed.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: CUDA 13 toolkit + cuBLAS (no GPU on the runner)
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb && sudo apt-get update -q
          sudo apt-get install -y -q cuda-nvcc-13-0 cuda-cudart-dev-13-0 libcublas-dev-13-0 cuda-cuobjdump-13-0 cuda-profiler-api-13-0 ninja-build
      - uses: actions/checkout@v4
        with:
          path: ours
      - name: lighttransport/Strata at the pinned commit + our patches (patches/lt-strata, ADR-009)
        shell: bash
        run: |
          git clone https://github.com/lighttransport/Strata.git lt-strata
          git -C lt-strata checkout e486a95d78876989b853b16c7056bcd96880afc3
          shopt -s nullglob
          for p in ours/patches/lt-strata/*.patch; do
            git -C lt-strata apply --verbose "$PWD/$p" || { echo "::error::patch does not apply: $p"; exit 1; }
            echo "::notice::applied $(basename "$p")"
          done
          echo "::notice::lt-strata at $(git -C lt-strata rev-parse HEAD)"
      - name: configure (sm_89 = RTX 4080 Super)
        shell: bash
        run: |
          if ! cmake -G Ninja -S lt-strata -B build-lt -DCMAKE_BUILD_TYPE=Release -DSTRATA_ENABLE_CUDA=ON \
               -DSTRATA_BUILD_TESTS=ON -DCMAKE_CUDA_ARCHITECTURES=89 \
               -DCMAKE_CUDA_COMPILER=/usr/local/cuda-13.0/bin/nvcc > cfg.log 2>&1; then
            grep -n "CMake Error" -A3 cfg.log | head -40 > err.txt || true
            while IFS= read -r l; do echo "::error::${l:0:900}"; done < err.txt
            exit 1
          fi
          echo "::notice::configure OK"
      - name: build the GLM decoder, the model inspector and the CPU tests
        shell: bash
        run: |
          if ! cmake --build build-lt -j4 --target strata-glm-decode strata-model-inspect gguf_reader_test model_test > build.log 2>&1; then
            grep -nE "error|Error|FAILED" build.log | head -25 > err.txt || true
            while IFS= read -r l; do echo "::error::${l:0:900}"; done < err.txt
            exit 1
          fi
          echo "::notice::lt-strata build OK, $(grep -c 'Building CUDA' build.log) CUDA objects"
      - name: decoder binary contains sm_89 code
        shell: bash
        run: |
          bin=$(find build-lt -type f -name strata-glm-decode -perm -u+x -print -quit)
          if [ -z "$bin" ]; then echo "::error::strata-glm-decode binary not found"; exit 1; fi
          echo "::notice::binary $bin, $(stat -c %s "$bin") bytes"
          /usr/local/cuda-13.0/bin/cuobjdump --list-elf "$bin" > elf.txt 2>&1 || true
          sed -E 's/.*\.(sm_[0-9a-z]+)\..*/\1/' elf.txt | sort | uniq -c > arch.txt
          echo "::notice::cubin archs: $(tr '\n' ' ' < arch.txt)"
          grep sm_89 elf.txt > /dev/null
      - name: CPU-only tests of the fork (GGUF reader, model description)
        shell: bash
        run: |
          export LD_LIBRARY_PATH=/usr/local/cuda-13.0/lib64:${LD_LIBRARY_PATH:-}
          rc=0
          for t in gguf_reader_test model_test; do
            if (cd build-lt && ctest -R "^${t}\$" --output-on-failure > "../$t.log" 2>&1); then
              echo "::notice::$t: $(grep -E 'tests passed|Passed' "$t.log" | tr '\n' ' ')"
            else
              grep -nE "FAILED|Failed|error|Error" "$t.log" | head -8 > err.txt || true
              while IFS= read -r l; do echo "::error::$t: ${l:0:600}"; done < err.txt
              rc=1
            fi
          done
          exit $rc
      - name: probe - does base B open our tiny GLM GGUF (not the 4096/2048 geometry)? Exploratory, never fails the job
        shell: bash
        run: |
          set +e   # GitHub runs bash with -e: a non-zero exit of the probed tool must not end the step
          pip install -q numpy
          git clone -q --filter=blob:none --sparse https://github.com/ggml-org/llama.cpp.git llama.cpp
          git -C llama.cpp checkout -q ec7630a640789c393694fb194f1bbbf0369fc62d
          git -C llama.cpp sparse-checkout set gguf-py
          export LD_LIBRARY_PATH=/usr/local/cuda-13.0/lib64:${LD_LIBRARY_PATH:-}
          for arch in glm5next glm5-next; do
            PYTHONPATH=llama.cpp/gguf-py python3 ours/tools/tinygen/glm5next_tiny.py "tiny-$arch.gguf" --layers 12 --arch "$arch" > gen.log 2>&1 \
              || { echo "::warning::tinygen failed for $arch: $(tail -c 300 gen.log | tr '\n' ' ')"; continue; }
            timeout 120 build-lt/strata-model-inspect "tiny-$arch.gguf" > "inspect-$arch.log" 2>&1; rc=$?
            echo "::notice::strata-model-inspect, tiny GGUF arch=$arch ($(stat -c %s "tiny-$arch.gguf") bytes): exit $rc"
            echo "::notice::arch=$arch output head: $(head -c 700 "inspect-$arch.log" | tr '\n' '|')"
            echo "::notice::arch=$arch output tail: $(tail -c 500 "inspect-$arch.log" | tr '\n' '|')"
          done
          exit 0
