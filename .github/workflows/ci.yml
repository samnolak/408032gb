# Copy to .github/workflows/ci.yml (pushing workflow files needs the token's Workflows permission).
# Runs on GitHub's free runners: no GPU, no customer PC needed.
name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  cpu-parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: llama.cpp at the pinned commit
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git ../llama.cpp
          git -C ../llama.cpp checkout ec7630a640789c393694fb194f1bbbf0369fc62d
          touch ../llama.cpp/ggml/ggml.pc.in   # needed only for the standalone ggml build below
      - name: deps
        run: pip install numpy pyyaml
      - name: unit tests
        run: python3 -m unittest discover -s tests -v
      - name: ggml delta-net parity (CPU)
        run: |
          cmake -S ../llama.cpp/ggml -B ../ggml-build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF -DGGML_OPENMP=OFF -DGGML_BACKEND_DL=OFF -DGGML_BUILD_TESTS=OFF -DGGML_BUILD_EXAMPLES=OFF
          cmake --build ../ggml-build -j4 --target ggml
          tests/ggml_parity/build.sh ../llama.cpp ../ggml-build
          GGML_GDN_HARNESS=tests/ggml_parity/gdn_harness LLAMA_CPP_GGUF_PY=../llama.cpp/gguf-py \
            python3 -m unittest tests.test_kda_vs_ggml tests.test_fitplan -v
      - name: G1 tiny-model parity against the real glm5-next graph (CPU)
        run: tools/tinygen/run_parity.sh ../llama.cpp ../build-tools
      - name: MiMo G1 tiny-model parity against the real mimo2 graph (CPU)
        run: tools/tinygen/run_parity_mimo.sh ../llama.cpp ../build-tools
  cuda-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: CUDA toolkit (compile only, no GPU on the runner)
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb && sudo apt-get update -q
          sudo apt-get install -y -q cuda-nvcc-13-0 cuda-cudart-dev-13-0
      - name: compile kernels for sm_89
        run: |
          shopt -s nullglob; files=(kernels/*.cu)
          if [ ${#files[@]} -eq 0 ]; then echo "no kernels yet"; exit 0; fi
          for f in "${files[@]}"; do /usr/local/cuda-13.0/bin/nvcc -arch=sm_89 -c "$f" -o /dev/null; done
  strata-glm-sm89:
    # ADR-007: the GLM engine base (sergqwer/strata-glm, MIT) built for the server's GPUs on Linux.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [89, 86]      # 89 = RTX 4080 Super (the server), 86 = RTX 3090 (the test host, branch 3090)
    steps:
      - name: CUDA 13 toolkit + cuBLAS (no GPU on the runner)
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb && sudo apt-get update -q
          sudo apt-get install -y -q cuda-nvcc-13-0 cuda-cudart-dev-13-0 libcublas-dev-13-0 cuda-cuobjdump-13-0 cuda-profiler-api-13-0 ninja-build
      - uses: actions/checkout@v4
        with:
          path: ours
      - name: strata-glm at the pinned commit + our patches (patches/strata-glm, ADR-007)
        shell: bash
        run: |
          git clone https://github.com/sergqwer/strata-glm.git
          git -C strata-glm checkout ed37419fccd0c52e07d26d526a29c2098f547843
          for p in ours/patches/strata-glm/*.patch; do
            git -C strata-glm apply --verbose "$PWD/$p" || { echo "::error::patch does not apply: $p"; exit 1; }
            echo "::notice::applied $(basename "$p")"
          done
      - name: Linux disk tier (patch 0003) functional test, CPU
        shell: bash
        run: ours/tests/strata_glm/run_diskreader_test.sh strata-glm
      - name: configure (sm_89 = RTX 4080 Super)
        shell: bash
        run: |
          set -o pipefail
          if ! cmake -G Ninja -S strata-glm -B build -DCMAKE_BUILD_TYPE=Release -DSTRATA_ENABLE_CUDA=ON \
               -DSTRATA_BUILD_TESTS=OFF -DCMAKE_CUDA_ARCHITECTURES=${{ matrix.arch }} \
               -DCMAKE_CUDA_COMPILER=/usr/local/cuda-13.0/bin/nvcc > cfg.log 2>&1; then
            grep -n "CMake Error" -A3 cfg.log | head -40 > err.txt || true
            while IFS= read -r l; do echo "::error::$l"; done < err.txt
            exit 1
          fi
      - name: build strata-glm
        shell: bash
        # the exit code must not be lost in a pipe; the first compiler errors are reported as annotations
        run: |
          if ! cmake --build build -j4 --target strata-glm > build.log 2>&1; then
            grep -nE "error|Error|FAILED" build.log | head -25 > err.txt || true
            while IFS= read -r l; do echo "::error::${l:0:900}"; done < err.txt
            exit 1
          fi
          echo "::notice::strata-glm build OK, $(grep -c 'Building CUDA' build.log) CUDA objects"
      - name: binary contains sm_89 code
        shell: bash
        # no early-exit pipes (head/grep -q) under pipefail; results go to annotations, readable via the API
        run: |
          bin=$(find build -type f -name strata-glm -perm -u+x -print -quit)
          if [ -z "$bin" ]; then
            echo "::error::strata-glm binary not found"
            find build -maxdepth 4 -type f -perm -u+x > exes.txt; echo "::notice::executables: $(tr '\n' ' ' < exes.txt)"
            exit 1
          fi
          echo "::notice::binary $bin, $(stat -c %s "$bin") bytes"
          /usr/local/cuda-13.0/bin/cuobjdump --list-elf "$bin" > elf.txt 2>&1 || true
          sed -E 's/.*\.(sm_[0-9a-z]+)\..*/\1/' elf.txt | sort | uniq -c > arch.txt
          echo "::notice::cubin archs: $(tr '\n' ' ' < arch.txt)"
          grep "sm_${{ matrix.arch }}" elf.txt > /dev/null
      - name: new flags are validated before any CUDA call (no GPU needed)
        shell: bash
        run: |
          bin=build/strata-glm; echo "1 2 3" > t.txt; fail=0
          expect() {   # expect <exit code> <text in stderr> <args...>
            local want=$1 text=$2; shift 2
            set +e; "$bin" "$@" > out.txt 2> err.txt; got=$?; set -e
            if [ "$got" = "$want" ] && grep -q -- "$text" err.txt; then echo "::notice::ok: $* -> $got"
            else echo "::error::$* -> exit $got, stderr: $(head -c 300 err.txt)"; fail=1; fi
          }
          expect 2 "unknown argument" --pack p --tokens t.txt --bogus
          expect 2 "increasing layers" --pack p --tokens t.txt --layer-split 50
          expect 2 "increasing layers" --pack p --tokens t.txt --layer-split 25,14
          expect 2 "needs 4 devices" --pack p --tokens t.txt --layer-split 14,25,35 --gpus 0,1
          exit $fail

  lt-strata-sm89:
    # ADR-009: GLM engine base B (lighttransport/Strata, branch glm53f, MIT): native GGUF backend, built for the
    # server's GPUs on Linux, plus its CPU-only tests. No GPU on the runner: nothing here measures speed.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: CUDA 13 toolkit + cuBLAS (no GPU on the runner)
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb && sudo apt-get update -q
          sudo apt-get install -y -q cuda-nvcc-13-0 cuda-cudart-dev-13-0 libcublas-dev-13-0 cuda-cuobjdump-13-0 cuda-profiler-api-13-0 ninja-build
      - uses: actions/checkout@v4
        with:
          path: ours
      - name: lighttransport/Strata at the pinned commit + our patches (patches/lt-strata, ADR-009)
        shell: bash
        run: |
          git clone https://github.com/lighttransport/Strata.git lt-strata
          git -C lt-strata checkout e486a95d78876989b853b16c7056bcd96880afc3
          shopt -s nullglob
          for p in ours/patches/lt-strata/*.patch; do
            git -C lt-strata apply --verbose "$PWD/$p" || { echo "::error::patch does not apply: $p"; exit 1; }
            echo "::notice::applied $(basename "$p")"
          done
          echo "::notice::lt-strata at $(git -C lt-strata rev-parse HEAD)"
      - name: configure (sm_89 = RTX 4080 Super)
        shell: bash
        run: |
          if ! cmake -G Ninja -S lt-strata -B build-lt -DCMAKE_BUILD_TYPE=Release -DSTRATA_ENABLE_CUDA=ON \
               -DSTRATA_BUILD_TESTS=ON -DCMAKE_CUDA_ARCHITECTURES=89 \
               -DCMAKE_CUDA_COMPILER=/usr/local/cuda-13.0/bin/nvcc > cfg.log 2>&1; then
            grep -n "CMake Error" -A3 cfg.log | head -40 > err.txt || true
            while IFS= read -r l; do echo "::error::${l:0:900}"; done < err.txt
            exit 1
          fi
          echo "::notice::configure OK"
      - name: build the GLM decoder, the model inspector and the CPU tests
        shell: bash
        run: |
          if ! cmake --build build-lt -j4 --target strata-glm-decode strata-model-inspect gguf_reader_test model_test > build.log 2>&1; then
            grep -nE "error|Error|FAILED" build.log | head -25 > err.txt || true
            while IFS= read -r l; do echo "::error::${l:0:900}"; done < err.txt
            exit 1
          fi
          echo "::notice::lt-strata build OK, $(grep -c 'Building CUDA' build.log) CUDA objects"
      - name: decoder binary contains sm_89 code
        shell: bash
        run: |
          bin=$(find build-lt -type f -name strata-glm-decode -perm -u+x -print -quit)
          if [ -z "$bin" ]; then echo "::error::strata-glm-decode binary not found"; exit 1; fi
          echo "::notice::binary $bin, $(stat -c %s "$bin") bytes"
          /usr/local/cuda-13.0/bin/cuobjdump --list-elf "$bin" > elf.txt 2>&1 || true
          sed -E 's/.*\.(sm_[0-9a-z]+)\..*/\1/' elf.txt | sort | uniq -c > arch.txt
          echo "::notice::cubin archs: $(tr '\n' ' ' < arch.txt)"
          grep sm_89 elf.txt > /dev/null
      - name: CPU-only tests of the fork (GGUF reader, model description)
        shell: bash
        run: |
          export LD_LIBRARY_PATH=/usr/local/cuda-13.0/lib64:${LD_LIBRARY_PATH:-}
          rc=0
          for t in gguf_reader_test model_test; do
            if (cd build-lt && ctest -R "^${t}\$" --output-on-failure > "../$t.log" 2>&1); then
              echo "::notice::$t: $(grep -E 'tests passed|Passed' "$t.log" | tr '\n' ' ')"
            else
              grep -nE "FAILED|Failed|error|Error" "$t.log" | head -8 > err.txt || true
              while IFS= read -r l; do echo "::error::$t: ${l:0:600}"; done < err.txt
              rc=1
            fi
          done
          exit $rc
      - name: probe - does base B open our tiny GLM GGUF (not the 4096/2048 geometry)? Exploratory, never fails the job
        shell: bash
        run: |
          pip install -q numpy
          git clone -q --filter=blob:none --sparse https://github.com/ggml-org/llama.cpp.git llama.cpp
          git -C llama.cpp checkout -q ec7630a640789c393694fb194f1bbbf0369fc62d
          git -C llama.cpp sparse-checkout set gguf-py
          export LD_LIBRARY_PATH=/usr/local/cuda-13.0/lib64:${LD_LIBRARY_PATH:-}
          for arch in glm5next glm5-next; do
            PYTHONPATH=llama.cpp/gguf-py python3 ours/tools/tinygen/glm5next_tiny.py "tiny-$arch.gguf" --layers 12 --arch "$arch" > gen.log 2>&1 \
              || { echo "::warning::tinygen failed for $arch: $(tail -c 300 gen.log | tr '\n' ' ')"; continue; }
            timeout 120 build-lt/strata-model-inspect "tiny-$arch.gguf" > "inspect-$arch.log" 2>&1; rc=$?
            echo "::notice::strata-model-inspect, tiny GGUF arch=$arch ($(stat -c %s "tiny-$arch.gguf") bytes): exit $rc"
            echo "::notice::arch=$arch output head: $(head -c 700 "inspect-$arch.log" | tr '\n' '|')"
            echo "::notice::arch=$arch output tail: $(tail -c 500 "inspect-$arch.log" | tr '\n' '|')"
          done
