# Fetches small text files (chat templates, tokenizer configs - never weights) of Hugging Face repos for the
# third_party/hf/*/REQUEST.json files that have no PIN.json yet, and commits them byte-exact back to the claude/*
# branch that triggered the run. vendor-hf.yml does the same for main and pushes to main; this one never touches main
# (AGENTS.md "Git and sync": agents publish only claude/* branches). The agent sandbox cannot reach huggingface.co.
name: vendor-hf-branch
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['third_party/hf/*/REQUEST.json']
permissions:
  contents: write
concurrency:
  group: vendor-hf-branch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  vendor:
    if: startsWith(github.ref_name, 'claude/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: fetch the pending requests from Hugging Face, verify git blob ids
        run: python3 scripts/vendor_hf_new.py
      - name: commit and push to this claude/* branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add third_party/hf
          if git diff --cached --quiet; then echo "::notice::nothing to commit"; exit 0; fi
          git commit -q -m "[infra-ops] vendor: Hugging Face text files under third_party/hf for ${{ github.ref_name }} (workflow vendor-hf-branch, run ${{ github.run_id }})"
          for i in 1 2 3; do
            if git pull -q --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}"; then
              echo "::notice::vendor commit $(git rev-parse HEAD)"; exit 0
            fi
            sleep 15
          done
          exit 1
